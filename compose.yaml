services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_NAME:-ledgerlock}
      POSTGRES_USER: ${DB_USERNAME:-ledgerlock}
      # Local development credentials only; never reuse for a deployed service.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerlock_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
