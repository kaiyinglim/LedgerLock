spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: ledgerlock
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerlock}
    username: ${DB_USERNAME:ledgerlock}
    password: ${DB_PASSWORD:ledgerlock_local}
    hikari:
      maximum-pool-size: 10
      # Keep PostgreSQL's READ COMMITTED default; verify it in integration tests.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
